
name: IK System iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create iOS environment
        run: |
          echo "VITE_ENV='production'" > .env.ios
          echo "VITE_BASE_API='${{ vars.VITE_BASE_API }}'" >> .env.ios
          echo "VITE_BASE_SERVER='${{ vars.VITE_BASE_SERVER }}'" >> .env.ios
          echo "VITE_COOKIE=''" >> .env.ios

      - name: Build Vue application
        run: npm run build:ios

      - name: Synchronize Capacitor iOS
        run: npx cap sync ios

      - name: Display Xcode version
        run: xcodebuild -version

      - name: Build iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Upload iOS application
        uses: actions/upload-artifact@v6
        with:
          name: IK-System-iOS-Simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
