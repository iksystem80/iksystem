name: IKlogy iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone:
    name: Build Signed iPhone IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create iOS environment
        run: |
          echo "VITE_ENV='production'" > .env.ios
          echo "VITE_BASE_API='${{ vars.VITE_BASE_API }}'" >> .env.ios
          echo "VITE_BASE_SERVER='${{ vars.VITE_BASE_SERVER }}'" >> .env.ios
          echo "VITE_COOKIE=''" >> .env.ios

      - name: Build Vue application
        run: npm run build:ios

      - name: Synchronize Capacitor iOS
        run: npx cap sync ios

      - name: Set iOS build number
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${{ github.run_number }}" \
            ios/App/App/Info.plist

      - name: Set iOS version
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 1.0.0" \
            ios/App/App/Info.plist

      - name: Decode Apple signing files
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APPLE_KEY_BASE64: ${{ secrets.APPLE_DISTRIBUTION_KEY_BASE64 }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          mkdir -p signing

          echo "$APPLE_CERT_BASE64" | base64 --decode > signing/distribution.cer
          echo "$APPLE_KEY_BASE64" | base64 --decode > signing/distribution.key
          echo "$APPLE_PROFILE_BASE64" | base64 --decode > signing/profile.mobileprovision

          openssl x509 \
            -inform DER \
            -in signing/distribution.cer \
            -out signing/distribution.pem

          openssl pkcs12 \
            -export \
            -inkey signing/distribution.key \
            -in signing/distribution.pem \
            -out signing/distribution.p12 \
            -password pass:"$P12_PASSWORD"

      - name: Install signing certificate
        env:
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/iklogy-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import signing/distribution.p12 \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security cms -D \
            -i signing/profile.mobileprovision \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PROFILE_PLIST")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PROFILE_PLIST")

          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PROFILE_PLIST")

          cp signing/profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

          echo "Provisioning Profile: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Display Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IKlogy.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.iklogy.app</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          mkdir -p ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/IKlogy.xcarchive" \
            -exportPath ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          IPA_FILE=$(find ipa -name "*.ipa" -type f | head -1)

          echo "Uploading $IPA_FILE to App Store Connect..."

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: IKlogy-Signed-IPA
          path: ipa/*.ipa
          if-no-files-found: error
          retention-days: 7